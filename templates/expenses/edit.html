{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Edit Expense</h1>
            <p class="auth-subtitle">Update your expense details</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('edit_expense', id=expense.id) }}">
                <input type="hidden" name="csrf_token" value="{{ session.get('csrf_token', '') }}">

                <div class="form-group">
                    <label for="amount">Amount (₨)</label>
                    <input type="number" id="amount" name="amount"
                           class="form-input"
                           step="0.01"
                           min="0.01"
                           placeholder="0.00"
                           value="{{ amount or expense.amount }}"
                           required autofocus>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled {% if not category and not expense.category %}selected{% endif %}>Select a category</option>
                        {% for cat in categories %}
                        <option value="{{ cat }}" {% if category == cat or (not category and expense.category == cat) %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input"
                           value="{{ date or expense.date }}"
                           required>
                </div>

                <div class="form-group">
                    <label for="description">Description <span class="form-hint">(optional)</span></label>
                    <input type="text" id="description" name="description"
                           class="form-input"
                           placeholder="What was this expense for?"
                           value="{{ description or expense.description or '' }}"
                           maxlength="200">
                </div>

                <button type="submit" class="btn-submit">Save Changes</button>
                <a href="{{ url_for('profile') }}" class="btn-ghost">Cancel</a>
            </form>
        </div>

    </div>
</section>

{% endblock %}
